# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

# Releases (v* tags) in this monorepo are Noverse releases. The archive name is
# pinned: apps/noverse/scripts/install.sh downloads ainovel-cli_<ver>_<os>_<arch>,
# and an inferred name would follow the repository (verse).
project_name: ainovel-cli

before:
  hooks:
    - go mod tidy
    - go vet ./...
    - go test -count=1 ./...

builds:
  - id: ainovel-cli
    main: ./apps/noverse/cmd/ainovel-cli
    binary: ainovel-cli
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w
      - -X main.version={{.Version}}
      - -X main.commit={{.Commit}}
      - -X main.date={{.CommitDate}}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - id: ainovel-cli-archive
    ids:
      - ainovel-cli
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - src: apps/noverse/README.md
        strip_parent: true
      - LICENSE
      - third_party/NOTICE
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else }}{{ .Arch }}{{ end }}

checksum:
  name_template: "{{ .ProjectName }}_checksums.txt"
  algorithm: sha256

changelog:
  sort: asc
  groups:
    - title: "New Features"
      regexp: '^feat'
    - title: "Bug Fixes"
      regexp: '^fix'
    - title: "Performance"
      regexp: '^perf'
    - title: "Refactor"
      regexp: '^refactor'
    - title: "Others"
      order: 999
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "^ci:"
      - "^style:"

release:
  github:
    owner: datnt1998
    name: verse
