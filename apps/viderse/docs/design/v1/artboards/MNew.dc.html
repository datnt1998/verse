<script type="text/x-dc" data-dc-script data-props='{"input": {"editor": "enum", "options": ["empty", "pasted", "multi"], "default": "pasted", "section": "Ô nhập"}, "prio": {"editor": "enum", "options": ["off", "on"], "default": "off", "section": "Nhiều link · Ưu tiên cả 3"}, "$preview": {"width": 390, "height": 844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { input: null, imagesOn: true };
  }
  componentDidUpdate(prev) {
    if (prev.input !== this.props.input || prev.prio !== this.props.prio) this.setState({ input: null, imagesOn: true, prio: null });
  }
  renderVals() {
    const input = this.state.input || this.props.input || 'pasted';
    const multi = input === 'multi';
    const has = input === 'pasted';
    const prio = this.state.prio !== null && this.state.prio !== undefined ? this.state.prio : this.props.prio === 'on';
    const modes = [['link', 'Dán link', 'i-link'], ['multi', 'Nhiều video', 'i-video-add']].map((m) => {
      const on = (m[0] === 'multi') === multi;
      return { label: m[1], icon: m[2], on: on ? 'true' : 'false', bg: on ? '#222225' : 'transparent', fg: on ? '#EDEDEF' : '#A0A0AB', fw: on ? '500' : '400',
        pick: () => this.setState({ input: m[0] === 'multi' ? 'multi' : 'empty' }) };
    });
