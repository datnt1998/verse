<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<title>Nhật ký — điện thoại</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500&amp;family=Literata:opsz,wght@7..72,400;7..72,500&amp;display=swap">
<style>
body{margin:0;background:#0B0B0D}
*{box-sizing:border-box}
a{color:#EDEDEF;text-decoration:none}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
button:disabled{cursor:not-allowed}
:focus-visible{outline:2px solid #C9A6F5;outline-offset:2px}
.card{background:linear-gradient(180deg,#171719 0%,#131315 100%);border:1px solid rgba(255,255,255,.07);box-shadow:inset 0 1px 0 rgba(255,255,255,.045),0 1px 2px rgba(0,0,0,.5)}
.dlg{background:#18181A;border:1px solid rgba(255,255,255,.1);border-radius:18px;box-shadow:0 30px 80px -20px rgba(0,0,0,.9),inset 0 1px 0 rgba(255,255,255,.05)}
.orb{border-radius:50%;flex:0 0 auto;box-shadow:inset -3px -5px 10px rgba(0,0,0,.28),inset 2px 3px 6px rgba(255,255,255,.4)}
.o-architect{background:radial-gradient(circle at 32% 26%,#EEF4FF 0%,#B9D0F7 28%,#7C93F3 62%,#5A57E3 100%)}
.o-writer{background:radial-gradient(circle at 32% 26%,#F3E8FF 0%,#C9A6F5 28%,#9A63E3 60%,#C9457F 100%)}
.o-editor{background:radial-gradient(circle at 32% 26%,#FFF1DC 0%,#F6CB8C 30%,#EC9548 62%,#E25E36 100%)}
.o-arbiter{background:radial-gradient(circle at 32% 26%,#E9FBEF 0%,#A6EDC1 28%,#5DC1B0 60%,#3E73D6 100%)}
.ghost:hover{background:rgba(255,255,255,.07) !important}
.primary:hover:not(:disabled){background:#FFFFFF !important}
.row:hover{background:rgba(255,255,255,.04) !important}
.navl:hover{color:#EDEDEF !important}
.mono{font-family:'JetBrains Mono',ui-monospace,monospace}
.num{font-variant-numeric:tabular-nums}
.lbl{font-size:11px;font-weight:600;letter-spacing:.08em;color:#7E7E8A;text-transform:uppercase}
.field{height:34px;padding:0 10px;border-radius:9px;background:#0F0F11;border:1px solid rgba(255,255,255,.1);color:#EDEDEF;font-size:13px;outline:none;width:100%}
.kbd{font-family:'JetBrains Mono',monospace;font-size:11px;color:#A0A0AB;padding:1px 5px;border-radius:4px;border:1px solid rgba(255,255,255,.1);background:#151517}
.av{border-radius:50%;background:#222225;border:1px solid rgba(255,255,255,.08);display:flex;align-items:center;justify-content:center;font-weight:600;color:#EDEDEF;flex:0 0 auto}
.spinner{width:14px;height:14px;border-radius:50%;border:2px solid rgba(255,255,255,.16);border-top-color:#EDEDEF;animation:spin .9s linear infinite;flex:0 0 auto}
@keyframes spin{to{transform:rotate(360deg)}}
.shim{background:linear-gradient(90deg,#A0A0AB 0%,#A0A0AB 35%,#F3E8FF 50%,#A0A0AB 65%,#A0A0AB 100%);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shim 2.4s linear infinite}
@keyframes shim{from{background-position:100% 0}to{background-position:-100% 0}}
.eq span{display:inline-block;width:2px;border-radius:1px;background:currentColor;animation:eq 1s ease-in-out infinite}
.eq span:nth-child(2){animation-delay:-.3s}.eq span:nth-child(3){animation-delay:-.6s}.eq span:nth-child(4){animation-delay:-.15s}
@keyframes eq{0%,100%{height:4px}50%{height:12px}}
.scroll{overflow-y:auto;scrollbar-width:thin;scrollbar-color:#2A2A2E transparent}
.ic{display:inline-block;flex:0 0 auto;width:18px;height:18px;background-color:currentColor;-webkit-mask-position:center;mask-position:center;-webkit-mask-size:contain;mask-size:contain;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat}

.mroot{position:relative;width:390px;height:844px;overflow:hidden;background:#0B0B0D;color:#EDEDEF;font-family:'Be Vietnam Pro',ui-sans-serif,system-ui,-apple-system,sans-serif;font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;display:flex;flex-direction:column;-webkit-tap-highlight-color:transparent}
.safe-top{flex:0 0 auto;height:40px}
.appbar{flex:0 0 auto;height:52px;padding:0 12px 0 14px;display:flex;align-items:center;gap:10px}
.mscroll{flex:1 1 auto;min-height:0;overflow-y:auto;overflow-x:hidden;scrollbar-width:none}
.mscroll::-webkit-scrollbar{display:none}
.tabbar{position:absolute;left:16px;right:16px;bottom:20px;z-index:30;height:64px;transition:transform .42s cubic-bezier(.2,.9,.25,1),opacity .3s}
.tabbar.mini{transform:translateY(6px) scale(.92)}
.tabbar.mini .tlab{opacity:0;max-height:0;margin-top:-2px}
.tabbar.hide{transform:translateY(110px);opacity:0;pointer-events:none}
.tcap{position:relative;height:100%;display:flex;padding:5px;border-radius:32px;background:rgba(26,26,29,.74);-webkit-backdrop-filter:blur(26px) saturate(180%);backdrop-filter:blur(26px) saturate(180%);border:1px solid rgba(255,255,255,.1);box-shadow:0 22px 44px -14px rgba(0,0,0,.85),0 2px 8px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.09)}
.tcap::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:linear-gradient(180deg,rgba(255,255,255,.06),rgba(255,255,255,0) 45%)}
.tind{position:absolute;top:5px;bottom:5px;border-radius:27px;background:rgba(201,166,245,.15);border:1px solid rgba(201,166,245,.3);box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 0 18px -4px rgba(154,99,227,.45);animation:tind .55s cubic-bezier(.2,.9,.25,1.15) both}
@keyframes tind{from{transform:scale(.7,.8);opacity:0}to{transform:none;opacity:1}}
.tab{position:relative;z-index:1;flex:1 1 0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border-radius:27px;font-size:10.5px;font-weight:500;color:#8E8E99;text-decoration:none;transition:color .2s}
.tab.on{color:#F3E8FF;font-weight:600}
.tab .tic{transition:transform .35s cubic-bezier(.2,.9,.3,1.4)}
.tab.on .tic{transform:translateY(-1px) scale(1.06)}
.tlab{display:block;max-height:16px;line-height:16px;transition:opacity .2s,max-height .3s,margin .3s}
.tab .dot{position:absolute;top:7px;left:calc(50% + 7px);width:8px;height:8px;border-radius:50%;background:#F6CB8C;box-shadow:0 0 0 2px #1A1A1D}
.tap{transition:transform .12s ease,background .15s,opacity .15s}
.tap:active{transform:scale(.96)}
.press:active{background:rgba(255,255,255,.06) !important}
.mbtn{height:50px;border-radius:14px;border:none;font-size:16px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap}
.mbtn.pri{background:#EDEDEF;color:#0B0B0D}
.mbtn.gho{background:rgba(255,255,255,.07);color:#EDEDEF}
.mbtn.dan{background:#E5484D;color:#fff}
.mbtn:disabled{opacity:.4}
.chipm{height:34px;padding:0 13px;border-radius:999px;border:1px solid rgba(255,255,255,.1);background:#151517;color:#D6D6DC;font-size:13.5px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;flex:0 0 auto}
.chipm.on{background:rgba(201,166,245,.16);border-color:rgba(201,166,245,.45);color:#F3E8FF}
.hscroll{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:0 16px}
.hscroll::-webkit-scrollbar{display:none}
.group{margin:0 16px;border-radius:16px;background:#141416;border:1px solid rgba(255,255,255,.06);overflow:hidden}
.grow{display:flex;align-items:center;gap:12px;min-height:54px;padding:8px 14px;border:none;background:transparent;color:#EDEDEF;font-size:15px;text-align:left;width:100%;text-decoration:none}
.grow+.grow{border-top:1px solid rgba(255,255,255,.06)}
.ghead{font-size:12.5px;color:#7E7E8A;padding:18px 30px 8px;letter-spacing:.02em}
.scrim{position:absolute;inset:0;z-index:45;background:rgba(4,4,6,.58);animation:mfade .25s ease-out both}
.scrim.out{animation:mfadeOut .24s ease-in both}
@keyframes mfade{from{opacity:0}to{opacity:1}}@keyframes mfadeOut{to{opacity:0}}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:50;display:flex;flex-direction:column;background:#18181A;border-radius:26px 26px 0 0;border-top:1px solid rgba(255,255,255,.1);box-shadow:0 -24px 60px -10px rgba(0,0,0,.8);padding-bottom:26px;animation:sheetIn .44s cubic-bezier(.2,.9,.25,1.03) both}
.sheet.out{animation:sheetOut .26s cubic-bezier(.5,0,.75,0) both}
@keyframes sheetIn{from{transform:translateY(100%)}to{transform:none}}
@keyframes sheetOut{to{transform:translateY(100%)}}
.grab{width:38px;height:5px;border-radius:3px;background:rgba(255,255,255,.22);margin:8px auto 6px;flex:0 0 auto}
.push-in{animation:pushIn .34s cubic-bezier(.2,.9,.25,1) both}
@keyframes pushIn{from{transform:translateX(28%);opacity:0}to{transform:none;opacity:1}}
.pop-back{animation:popBack .3s cubic-bezier(.2,.9,.25,1) both}
@keyframes popBack{from{transform:translateX(-18%);opacity:0}to{transform:none;opacity:1}}
.mtoast{position:absolute;left:16px;right:16px;z-index:60;display:flex;align-items:center;gap:10px;min-height:48px;padding:10px 14px;border-radius:16px;background:#1E1E21;border:1px solid rgba(255,255,255,.1);box-shadow:0 18px 40px -12px rgba(0,0,0,.85);font-size:14px;animation:mtoast .42s cubic-bezier(.2,.9,.25,1.12) both}
@keyframes mtoast{from{opacity:0;transform:translateY(14px) scale(.96)}to{opacity:1;transform:none}}
.mfield{width:100%;height:46px;padding:0 14px;border-radius:13px;background:#0F0F11;border:1px solid rgba(255,255,255,.1);color:#EDEDEF;font-size:16px;outline:none}
.mfield:focus{border-color:rgba(201,166,245,.55);box-shadow:0 0 0 3px rgba(201,166,245,.14)}
.msw{position:relative;width:51px;height:31px;border-radius:999px;border:none;flex:0 0 auto;transition:background .2s}
.msw i{position:absolute;top:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.35);transition:left .24s cubic-bezier(.3,.9,.3,1.15)}
.live{animation:mbreathe 2.6s ease-in-out infinite}
@keyframes mbreathe{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
.caretm{display:inline-block;width:2px;height:1em;vertical-align:-2px;background:#C9A6F5;margin-left:2px;animation:mblink 1s steps(1) infinite}
@keyframes mblink{50%{opacity:0}}
.rise{animation:mrise .4s cubic-bezier(.2,.9,.25,1.05) both}
@keyframes mrise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.ringm{position:relative;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:0 0 auto;background:#141416}
.ringm i.arc{position:absolute;inset:0;border-radius:50%;-webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 2.5px),#000 calc(100% - 2px));mask:radial-gradient(farthest-side,transparent calc(100% - 2.5px),#000 calc(100% - 2px))}

.mscroll>*{flex-shrink:0}
.chead{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;width:100%;min-height:52px;padding:0 16px;border:none;background:rgba(11,11,13,.9);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);color:#EDEDEF;text-align:left;border-bottom:1px solid rgba(255,255,255,.05)}
.ev{position:relative;display:flex;gap:12px;padding:10px 16px 10px 16px}
.ev .rail{position:absolute;left:27px;top:0;bottom:0;width:1.5px;background:rgba(255,255,255,.09)}
.ev:first-child .rail{top:18px}.ev:last-child .rail{bottom:calc(100% - 18px)}
.ev .nd{position:relative;z-index:1;width:24px;height:24px;border-radius:50%;flex:0 0 auto;display:flex;align-items:center;justify-content:center;background:#0B0B0D;margin-top:1px}
.tool{display:flex;align-items:center;gap:8px;width:100%;min-height:40px;padding:0 10px;border-radius:11px;border:1px solid rgba(255,255,255,.08);background:#121214;color:#C9C9D1;text-align:left;font-size:13px}
.tool.on{border-color:rgba(201,166,245,.35);background:rgba(201,166,245,.06)}
.toolio{margin:6px 0 0;padding:10px 12px;border-radius:11px;background:#0E0E10;border:1px solid rgba(255,255,255,.06);display:flex;flex-direction:column;gap:6px}
.code{margin:6px 0 0;padding:10px 12px;border-radius:11px;background:#0E0E10;border:1px solid rgba(255,255,255,.06);font-family:'JetBrains Mono',ui-monospace,monospace;font-size:12px;line-height:1.65;color:#B8B8C2;white-space:pre-wrap;word-break:break-word;animation:mrise .3s cubic-bezier(.2,.9,.25,1.05) both}
.newin{animation:evIn .5s cubic-bezier(.2,.9,.25,1.05) both}
@keyframes evIn{from{opacity:0;transform:translateY(-8px);background:rgba(201,166,245,.1)}to{opacity:1;transform:none;background:transparent}}
.livedot{width:8px;height:8px;border-radius:50%;background:#A6EDC1;box-shadow:0 0 0 0 rgba(166,237,193,.6);animation:lpulse 1.8s ease-out infinite}
@keyframes lpulse{0%{box-shadow:0 0 0 0 rgba(166,237,193,.55)}100%{box-shadow:0 0 0 9px rgba(166,237,193,0)}}
.jump{position:absolute;left:50%;top:204px;z-index:20;transform:translateX(-50%);height:38px;padding:0 14px;border-radius:999px;border:1px solid rgba(201,166,245,.4);background:rgba(36,28,48,.92);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);color:#F3E8FF;font-size:13.5px;display:flex;align-items:center;gap:6px;box-shadow:0 12px 28px -10px rgba(0,0,0,.8);animation:jIn .4s cubic-bezier(.2,.9,.25,1.2) both;white-space:nowrap}
@keyframes jIn{from{opacity:0;transform:translate(-50%,-10px) scale(.9)}to{opacity:1;transform:translate(-50%,0)}}
mark{background:rgba(246,203,140,.25);color:#FBE3BD;border-radius:3px;padding:0 1px}
.chev{transition:transform .25s cubic-bezier(.2,.9,.3,1)}
.chev.up{transform:rotate(180deg)}
.i-arrow-d{-webkit-mask-image:url(../icons/arrow-down-2.svg);mask-image:url(../icons/arrow-down-2.svg)}
.i-arrow-l{-webkit-mask-image:url(../icons/arrow-left-2.svg);mask-image:url(../icons/arrow-left-2.svg)}
.i-book{-webkit-mask-image:url(../icons/book-1.svg);mask-image:url(../icons/book-1.svg)}
.i-chart{-webkit-mask-image:url(../icons/chart-2.svg);mask-image:url(../icons/chart-2.svg)}
.i-chev-up{-webkit-mask-image:url(../icons/arrow-up-2.svg);mask-image:url(../icons/arrow-up-2.svg)}
.i-code{-webkit-mask-image:url(../icons/code.svg);mask-image:url(../icons/code.svg)}
.i-copy{-webkit-mask-image:url(../icons/copy.svg);mask-image:url(../icons/copy.svg)}
.i-edit{-webkit-mask-image:url(../icons/edit-2.svg);mask-image:url(../icons/edit-2.svg)}
.i-folder{-webkit-mask-image:url(../icons/folder-open.svg);mask-image:url(../icons/folder-open.svg)}
.i-note{-webkit-mask-image:url(../icons/note-text.svg);mask-image:url(../icons/note-text.svg)}
.i-routing{-webkit-mask-image:url(../icons/routing-2.svg);mask-image:url(../icons/routing-2.svg)}
.i-search{-webkit-mask-image:url(../icons/search-normal-1.svg);mask-image:url(../icons/search-normal-1.svg)}
.i-shield{-webkit-mask-image:url(../icons/shield-security.svg);mask-image:url(../icons/shield-security.svg)}
.i-tick{-webkit-mask-image:url(../icons/tick-circle.svg);mask-image:url(../icons/tick-circle.svg)}
.i-warning{-webkit-mask-image:url(../icons/warning-2.svg);mask-image:url(../icons/warning-2.svg)}
@media (prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important}}
/* motion:controls v1 — xem 17-kit.md › Chuyển động của điều khiển */
[role=switch],[role=radio],[role=checkbox],.sw,.msw,.cb,.rd,.rdot,.rcard{transition:background-color .2s ease,border-color .2s ease,color .2s ease,box-shadow .2s ease,transform .14s ease}
[role=switch] *,[role=radio] *,[role=checkbox] *{transition:background-color .2s ease,border-color .2s ease,color .2s ease,opacity .18s ease}
span.mo-thumb{display:block;transform:translateX(var(--tx,0px)) scaleX(var(--sx,1))}
span.mo-seg{position:absolute;top:3px;left:3px;height:30px;border-radius:7px;background:#2A2A2E;box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 1px 2px rgba(0,0,0,.4);pointer-events:none}
input[type=checkbox]{appearance:none;-webkit-appearance:none;margin:0;width:18px;height:18px;flex:0 0 auto;border-radius:5px;border:1.5px solid rgba(255,255,255,.28);background:transparent;display:inline-grid;place-content:center;cursor:pointer;transition:background-color .16s ease,border-color .16s ease}
input[type=checkbox]::before{content:"";width:11px;height:11px;background:#0B0B0D;clip-path:polygon(14% 52%,0 66%,38% 100%,100% 22%,86% 8%,38% 72%);transform:scale(0);transition:transform .22s cubic-bezier(.34,1.56,.64,1)}
input[type=checkbox]:checked{background:#C9A6F5;border-color:#C9A6F5}
input[type=checkbox]:checked::before{transform:scale(1)}
input[type=checkbox]:focus-visible{outline:2px solid #C9A6F5;outline-offset:2px}
@media (prefers-reduced-motion:no-preference){
.mo-seg{transition:transform .3s cubic-bezier(.34,1.25,.5,1)}
.sw i,.msw i,.mo-thumb{transition:left .3s cubic-bezier(.34,1.45,.5,1),transform .3s cubic-bezier(.34,1.45,.5,1),background-color .2s ease,width .14s ease}
.sw:active:not(:disabled) i,.msw:active:not(:disabled) i,[role=switch]:active:not(:disabled) .sw i{transform:scaleX(1.22);transform-origin:left center}
[role=switch][aria-checked=true]:active:not(:disabled) i,[role=switch][aria-checked=true]:active .sw i{transform-origin:right center}
[role=switch]:active:not(:disabled) .mo-thumb{--sx:1.22;transform-origin:left center}
[role=switch][aria-checked=true]:active:not(:disabled) .mo-thumb{transform-origin:right center}
[role=radio]:active:not(:disabled),[role=checkbox]:active:not(:disabled){transform:scale(.97)}
.rcard:active,.opt[role=radio]:active{transform:scale(.985)}
[role=radio][aria-checked=true] span[aria-hidden=true]:empty,[role=radio][aria-checked=true] [aria-hidden=true]>span:empty,.rd.on::after,.rcard.on .rdot::after{animation:mo-dot .32s cubic-bezier(.34,1.56,.64,1)}
[role=radio][aria-checked=true] .ic.i-tick,[role=radio][aria-checked=true] .ic.i-tick-b{animation:mo-tick .26s cubic-bezier(.34,1.56,.64,1)}
[role=checkbox][aria-checked=true] .cb,[role=checkbox][aria-checked=true]>span[aria-hidden=true]:first-child{animation:mo-pop .34s cubic-bezier(.34,1.56,.64,1)}
[role=checkbox][aria-checked=true] svg path{stroke-dasharray:28;stroke-dashoffset:28;animation:mo-draw .26s .06s ease-out forwards}
[role=checkbox][aria-checked=true] .ic{animation:mo-tick .26s .04s cubic-bezier(.34,1.56,.64,1) both}
input[type=checkbox]:checked{animation:mo-pop .34s cubic-bezier(.34,1.56,.64,1)}
}
@keyframes mo-dot{from{transform:scale(0)}to{transform:scale(1)}}
@keyframes mo-pop{0%{transform:scale(.82)}55%{transform:scale(1.08)}100%{transform:scale(1)}}
@keyframes mo-draw{to{stroke-dashoffset:0}}
@keyframes mo-tick{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}
</style>
</helmet>
<div class="mroot">
<div class="safe-top"></div>
<header class="appbar" style="padding-left: 4px; gap: 4px">
<a class="tap" href="MWork.dc.html" aria-label="Quay lại Viết" style="width: 44px; height: 44px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #EDEDEF; flex: 0 0 auto"><span class="ic i-arrow-l" aria-hidden="true" style="width: 22px; height: 22px"></span></a>
<sc-if value="{{noSearch}}" hint-placeholder-val="{{ true }}"><span style="flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; line-height: 1.25"><span style="font-size: 17px; font-weight: 600">Nhật ký hoạt động</span><span style="font-size: 12px; color: #8E8E99; display: flex; align-items: center; gap: 6px"><span class="livedot" aria-hidden="true"></span>Đang ghi trực tiếp · {{evCount}} sự kiện</span></span>
<button class="tap" type="button" onClick="{{openSearch}}" aria-label="Tìm trong nhật ký" style="width: 44px; height: 44px; border-radius: 50%; border: none; background: transparent; color: #C9C9D1; display: flex; align-items: center; justify-content: center; flex: 0 0 auto"><span class="ic i-search" aria-hidden="true" style="width: 21px; height: 21px"></span></button></sc-if>
<sc-if value="{{searching}}" hint-placeholder-val="{{ false }}"><label style="flex: 1 1 auto; min-width: 0; height: 40px; padding: 0 12px; border-radius: 12px; background: #18181A; border: 1px solid rgba(201,166,245,0.4); display: flex; align-items: center; gap: 8px"><span class="ic i-search" aria-hidden="true" style="width: 17px; height: 17px; color: #8E8E99"></span><input type="search" value="{{q}}" onInput="{{onQ}}" placeholder="Tìm sự kiện, công cụ, lỗi…" aria-label="Tìm trong nhật ký" style="flex: 1 1 auto; min-width: 0; border: none; background: transparent; color: #EDEDEF; font-size: 16px; outline: none"></label>
<button class="tap" type="button" onClick="{{closeSearch}}" style="height: 44px; padding: 0 8px; border: none; background: transparent; color: #C9A6F5; font-size: 15px; flex: 0 0 auto">Huỷ</button></sc-if>
</header>
<div class="hscroll" role="tablist" aria-label="Lọc nhật ký" style="padding-top: 2px; padding-bottom: 10px; flex: 0 0 auto">
