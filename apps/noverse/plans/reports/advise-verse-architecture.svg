  <text x="10" y="766" font-size="12" fill="#9aa0a6">Mũi tên = chiều import, chỉ đi xuống: core không import platform/apps · platform không import apps · app không import app khác.</text>
  <text x="10" y="786" font-size="12" fill="#9aa0a6">* giả định: cổng, thư mục dữ liệu, lĩnh vực và tổ agent của Soverse.</text>
