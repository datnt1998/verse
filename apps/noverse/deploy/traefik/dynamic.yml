# Traefik dynamic configuration for the local Dokploy-mirror stack.
#
# Routing is declared here (file provider) instead of the Docker provider: the
# Docker socket is not usable inside every local Docker Desktop setup, and the
# local stack must stay reproducible. In Dokploy the platform's Traefik uses
# its Docker/Swarm provider + ACME instead — see deploy/README.md §Dokploy.
#
# The certificate is generated by the `certgen` service into the shared certs
# volume; both routers use it.

http:
  routers:
    noverse:
      rule: Host(`noverse.localhost`)
      entryPoints: [websecure]
      service: noverse
      tls: {}
    noverse-web:
      rule: Host(`noverse.localhost`)
      entryPoints: [web]
      service: noverse
  services:
    noverse:
      loadBalancer:
        servers:
          # Private container network only: the app port is never published.
          - url: http://app:8080

tls:
  certificates:
    - certFile: /certs/noverse.crt
      keyFile: /certs/noverse.key
  stores:
    default:
      defaultCertificate:
        certFile: /certs/noverse.crt
        keyFile: /certs/noverse.key
