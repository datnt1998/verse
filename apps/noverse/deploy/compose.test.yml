# Disposable PG + Garage integration dependencies. Set fresh secrets in env:
# GARAGE_RPC_SECRET=$(openssl rand -hex 32)
# GARAGE_ADMIN_TOKEN=$(openssl rand -hex 32)
# S3_TEST_ACCESS_KEY=GK$(openssl rand -hex 12)
# S3_TEST_SECRET_KEY=$(openssl rand -hex 32)
# docker compose -f deploy/compose.test.yml up -d --wait
# docker compose -f deploy/compose.test.yml down -v
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: test
      POSTGRES_DB: ainovel_test
    ports:
      - "127.0.0.1:${POSTGRES_TEST_PORT:-64632}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ainovel_test"]
      interval: 2s
      timeout: 3s
      retries: 20
    tmpfs:
      - /var/lib/postgresql/data

  garage:
    image: dxflrs/garage:v2.5.0
    command: ["/garage", "server"]
    environment: &garage-env
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET:?Set a fresh 32-byte hex RPC secret}
      GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN:?Set a fresh admin token}
    ports:
      - "127.0.0.1:${S3_TEST_PORT:-64600}:3900"
      - "127.0.0.1:${S3_TEST_ADMIN_PORT:-64603}:3903"
    volumes:
      - ./garage/garage.toml:/etc/garage.toml:ro
      - garage-meta:/var/lib/garage/meta
      - garage-data:/var/lib/garage/data
    healthcheck:
      # RPC readiness precedes layout initialization; health requires a layout.
      test: ["CMD", "/garage", "status"]
      interval: 2s
      timeout: 3s
      retries: 30

  garage-init:
    build: ./garage
    depends_on:
      garage:
        condition: service_healthy
    environment:
      <<: *garage-env
      S3_ACCESS_KEY_ID: ${S3_TEST_ACCESS_KEY:?Set a Garage test key ID (GK + 24 hex digits)}
      S3_SECRET_ACCESS_KEY: ${S3_TEST_SECRET_KEY:?Set a fresh test key secret}
      S3_BUCKET: ${S3_TEST_BUCKET:-blobstore-test}
    volumes:
      - ./garage/garage.toml:/etc/garage.toml:ro
      - garage-meta:/var/lib/garage/meta:ro
    restart: "no"

volumes:
  garage-meta:
  garage-data:
