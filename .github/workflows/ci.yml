name: CI

# Chạy tay (Actions › CI › Run workflow) hoặc khi mở PR — không chạy mỗi lần push để tiết kiệm quota.
on:
  pull_request:
  workflow_dispatch:
    inputs:
      windows:
        description: "Chạy thêm Windows (tính phút gấp đôi)"
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.windows && '["ubuntu-latest","windows-latest"]' || '["ubuntu-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install ffmpeg
        if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg

      - name: Format check
        shell: bash
        run: test -z "$(gofmt -l .)"

      - name: Installer syntax check
        if: runner.os == 'Linux'
        run: sh -n apps/noverse/scripts/install.sh

      - name: Vet
        env:
          GOWORK: "off"
        run: go vet ./...

      - name: Generated SQL code is current
        if: runner.os == 'Linux'
        working-directory: apps/noverse
        env:
          GOWORK: "off"
        run: go tool sqlc diff

      - name: Generated SQL code is current (viderse)
        if: runner.os == 'Linux'
        working-directory: apps/viderse
        env:
          GOWORK: "off"
        run: go tool sqlc diff

      - name: Generated SQL code is current (shared identity)
        if: runner.os == 'Linux'
        working-directory: platform/identity/postgres
        env:
          GOWORK: "off"
        run: go tool sqlc diff

      - name: Start Postgres and Garage
        if: runner.os == 'Linux'
        shell: bash
        run: |
          echo "GARAGE_RPC_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "GARAGE_ADMIN_TOKEN=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "S3_TEST_ACCESS_KEY=GK$(openssl rand -hex 12)" >> "$GITHUB_ENV"
          echo "S3_TEST_SECRET_KEY=$(openssl rand -hex 32)" >> "$GITHUB_ENV"

      - name: Provision integration services
        if: runner.os == 'Linux'
        run: docker compose -f apps/noverse/deploy/compose.test.yml up -d --build --wait

      # Linux runs Postgres and Garage against apps/noverse/deploy/compose.test.yml
      # and fails instead of skipping them; Windows has no service containers.
      - name: Test
        env:
          GOWORK: "off"
          REQUIRE_POSTGRES_TEST: ${{ runner.os == 'Linux' && '1' || '' }}
          TEST_DATABASE_URL: ${{ runner.os == 'Linux' && 'postgres://postgres:test@127.0.0.1:64632/ainovel_test' || '' }}
          REQUIRE_S3_TEST: ${{ runner.os == 'Linux' && '1' || '' }}
          S3_TEST_ENDPOINT: ${{ runner.os == 'Linux' && 'http://127.0.0.1:64600' || '' }}
          S3_TEST_ADMIN_ENDPOINT: ${{ runner.os == 'Linux' && 'http://127.0.0.1:64603' || '' }}
          S3_TEST_REGION: garage
        run: go test -buildvcs=false -count=1 -timeout 1800s ./...

      - name: Remove integration services
        if: always() && runner.os == 'Linux'
        run: docker compose -f apps/noverse/deploy/compose.test.yml down -v

      - name: Race test critical state paths
        if: runner.os == 'Linux'
        env:
          GOWORK: "off"
        run: go test -race -buildvcs=false -count=1 ./apps/noverse/internal/host ./apps/noverse/internal/store ./apps/noverse/internal/tools

  # npm workspace ở gốc repo: platform/ui (kit dùng chung), apps/noverse/web,
  # apps/viderse/web — một lockfile, chạy typecheck/test của từng workspace.
  web:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck --workspaces

      - name: Test
        run: npm test --workspaces

  viderse-web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/viderse/web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/viderse/web/package-lock.json

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test
